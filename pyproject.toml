[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cairnmap"
dynamic = ["version"]
description = "A workspace map for coding agents: every repo in a folder, how they connect, and where to look."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The cairn authors" }]
keywords = ["mcp", "claude-code", "codex", "cursor", "ai-agents", "microservices", "monorepo", "knowledge-graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Documentation",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.16",
  "pydantic>=2.11",
  "pyyaml>=6.0.2",
  "pathspec>=0.12",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
# Deep per-repo code indexes (`cairn deep build`). graphify runs as a subprocess, never imported.
graphify = ["graphifyy>=0.9.77,<0.10"]

[project.urls]
Homepage = "https://github.com/Moe1177/cairn"
Source = "https://github.com/Moe1177/cairn"
Issues = "https://github.com/Moe1177/cairn/issues"
Changelog = "https://github.com/Moe1177/cairn/blob/main/CHANGELOG.md"

[project.scripts]
cairn = "cairn.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "tiktoken>=0.7",
  "pytest-xdist>=3.6",
]

[tool.hatch.version]
path = "src/cairn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.sdist]
include = ["/src/cairn", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "fixtures", ".superpowers", "bench/suites", "bench/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pathlib.Path", "typer.Argument", "typer.Option"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
