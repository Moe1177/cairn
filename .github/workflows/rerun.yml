name: rerun

# GitHub-hosted runners sometimes never pick a job up ("The job was not acquired by Runner").
# Such a job fails before any step runs, so nothing inside it can retry. This re-runs the
# failed jobs of a ci run once, and only when a job never started: real failures stand.
# It checks out no code and only reads run metadata, so it is safe for pull requests.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run jobs that no runner picked up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          # A newer run of this branch supersedes this one (it was cancelled for a reason).
          latest=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?branch=$BRANCH&per_page=1" --jq '.workflow_runs[0].id')
          if [ "$latest" != "$RUN_ID" ]; then
            echo "A newer run ($latest) exists; nothing to do."
            exit 0
          fi
          # A job GitHub never started has no steps; any other failure is real.
          unstarted=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and (.steps | length) == 0)] | length')
          if [ "$unstarted" -gt 0 ]; then
            echo "$unstarted job(s) never started; re-running the failed jobs once."
            gh run rerun "$RUN_ID" --repo "$REPO" --failed
          else
            echo "Every failed job ran; not retrying."
          fi
