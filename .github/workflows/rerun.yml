name: rerun

# GitHub-hosted runners sometimes never pick a job up ("The job was not acquired by Runner").
# Such a job fails before any step runs, so nothing inside it can retry. This re-runs a ci
# run's failed jobs once, and only when every failed job is one of those: when any job ran
# and failed, nothing is retried. It checks out no code and reads only run metadata.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run jobs that no runner picked up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          # A newer run of this branch supersedes this one.
          latest=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?branch=$BRANCH&per_page=1" --jq '.workflow_runs[0].id')
          if [ "$latest" != "$RUN_ID" ]; then
            echo "A newer run ($latest) exists; nothing to do."
            exit 0
          fi
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .id')
          unacquired=0
          real=0
          for job in $failed; do
            # The job id is also its check run id; GitHub annotates runner-capacity failures.
            if gh api "repos/$REPO/check-runs/$job/annotations" --jq '.[].message' | grep -q "not acquired by Runner"; then
              unacquired=$((unacquired + 1))
            else
              real=$((real + 1))
            fi
          done
          if [ "$unacquired" -gt 0 ] && [ "$real" -eq 0 ]; then
            echo "$unacquired job(s) were never picked up by a runner; re-running them once."
            gh run rerun "$RUN_ID" --repo "$REPO" --failed
          else
            echo "Not retrying: $real job(s) failed for a real reason, $unacquired never started."
          fi
