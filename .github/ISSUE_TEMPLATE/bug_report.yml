name: Bug report
description: Something cairn did wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran, and the shape of your workspace (number of repos, languages).
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `cairn --version`
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `cairn status` (remove anything private)
      render: text
  - type: dropdown
    id: harness
    attributes:
      label: Agent harness
      multiple: true
      options: [Claude Code, Codex, Gemini CLI, Cursor, None / CLI only]
