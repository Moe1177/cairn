# What an agent passes find_similar for each task in prior_art.yaml: written by a model
# from the task and org_profile.md (cairn bench-prior-art --make-terms), never edited by hand.
model: haiku
generated: '2026-10-17'
prompt: 'The code you''ll search belongs to an org whose repos use this stack:


  The stack of aws-samples (github.com): what its 200 most recently pushed repos use (share of those repos),
  read 2026-10-17.

  Languages: Python 40%, TypeScript 26%, JavaScript 8%, Jupyter Notebook 6%, Shell 5%, HCL 4%, Java 2%,
  Go 2%

  Datastores: S3 42%, DynamoDB 27%, OpenSearch/Elasticsearch 10%, PostgreSQL 8%, MySQL 7%, Redis 6%, MongoDB
  3%, Neptune 2%

  Messaging: EventBridge 10%, SQS 8%, SNS 8%, Kafka 4%, Kinesis 2%, RabbitMQ 1%

  Serverless and APIs: AWS Lambda 52%, Bedrock 36%, Step Functions 8%, API Gateway 7%, Lambda Powertools
  4%, AppSync/GraphQL 4%, gRPC 1%

  Web frameworks: React 32%, FastAPI 12%, Express 10%, Next.js 6%, Flask 2%, Vue 2%, Streamlit 2%, Spring
  Boot 2%

  Data access: Pydantic 16%, SQLAlchemy 2%, Drizzle 1%

  Auth: Cognito 26%, JWT 14%

  Observability: CloudWatch 14%, OpenTelemetry 8%, Prometheus 8%, X-Ray 4%

  Testing: pytest 29%, Jest 27%, Vitest 16%, Playwright 4%, moto 4%, JUnit 2%

  Deploy and CI: Docker 54%, AWS CDK 50%, GitHub Actions 43%, Terraform 19%, Kubernetes 16%, CloudFormation
  14%, Amplify 11%, AWS SAM 11%

  Python libraries: boto3 42%, strands-agents 24%, pytest 18%, requests 18%, bedrock-agentcore 16%, pydantic
  16%, mcp 16%, uvicorn 13%, botocore 12%, fastapi 12%, strands-agents-tools 12%, constructs 12%

  npm libraries: react 32%, react-dom 32%, aws-cdk-lib 30%, aws-cdk 30%, constructs 30%, jest 22%, vite
  18%, vitest 16%, cdk-nag 13%, tailwindcss 12%, @aws-sdk/client-s3 12%, @aws-sdk/client-dynamodb 11%

  Go libraries: github.com/aws/aws-sdk-go-v2/config 2%, github.com/aws/aws-sdk-go-v2 2%

  Topics: aws, amazon-bedrock, generative-ai, react, eks, dynamodb, terraform, serverless, aws-cdk, agentic-ai,
  claude, cdk

  Choosing find_similar terms: when the request names a technology (Stripe, Cognito), search for that
  technology''s own calls; when it doesn''t, search this stack''s words (its SDK calls, libraries and
  own packages), not another stack''s (a different database''s API, say).


  A developer wants to build: "{task}" Write 3 GitHub code-search queries that would find an existing
  implementation of this in other repos. Each query is 1 to 3 words that would literally appear in such
  code: class or function names, SDK calls, library names, config keys. One query per line, nothing else.'
terms:
  ses-email:
  - send_raw_email
  - boto3.client('ses')
  - sesv2 send_email
  emf-metrics:
  - CloudWatchMetrics
  - aws_embedded_metrics
  - add_metric
  vector-index:
  - knn_vector
  - index.knn
  - opensearch-py
  transcribe-upload:
  - start_transcription_job
  - MediaFileUri
  - TranscriptionJobName
  google-sign-in:
  - create_identity_provider
  - SupportedIdentityProviders
  - signInWithRedirect
  shared-counter:
  - UpdateExpression
  - update_item
  - INCRBY
  wait-for-callback:
  - waitForTaskToken
  - send_task_success
  - sendTaskSuccess
  one-at-a-time:
  - attribute_not_exists
  - DistributedLock
  - pg_try_advisory_lock
  remember-results:
  - TTLCache
  - lru_cache
  - cache_ttl
  records-expire:
  - TimeToLiveSpecification
  - update_time_to_live
  - timeToLiveAttribute
  email-link-sign-in:
  - magic link
  - magic_link
  - createAuthChallenge
  read-aloud:
