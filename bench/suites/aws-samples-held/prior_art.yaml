# Held-out prior-art key for github.com/aws-samples: 12 tasks written after cairn's find_similar
# was tuned on the dev key (../aws-samples), and scored once with no tuning after. Each answer
# was found by searching for code identifiers (not the task's words) and confirmed by reading
# the file on 2026-10-17. The org holds more implementations than any key lists: read a low
# score next to the report's judged@5.
# The pooled top fives of every locator's one run were then judged by reading each file.
