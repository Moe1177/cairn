name: openfaas
workspace: fetched
related_repos_doc: related_repos.md
# OpenFaaS (github.com/openfaas), 38 repos: the coupled core (gateway, providers, CLI, SDKs,
# queue worker, watchdogs, connectors, templates, store) and the org's other repos a developer
# would have cloned beside it (docs, archived cloud/bootstrap, release tooling). Mostly MIT; faas,
# faas-netes and faasd carry extra notices. Fetched at pinned commits, never vendored. Held out:
# never used to tune cairn's detectors.
