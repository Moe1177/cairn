  # faas-cli/go.mod requires github.com/openfaas/go-sdk (imports go-sdk/stack, seal, builder)
  - {from: faas-cli, to: go-sdk, kind: package}
  # faas-netes/go.mod requires github.com/openfaas/faas-provider (implements the provider: imports faas-provider, types, logs, proxy)
  - {from: faas-netes, to: faas-provider, kind: package}
  # faas-swarm/go.mod requires github.com/openfaas/faas-provider
  - {from: faas-swarm, to: faas-provider, kind: package}
  # faasd/go.mod requires github.com/openfaas/faas-provider
  - {from: faasd, to: faas-provider, kind: package}
  # function-builder-examples/go.mod requires github.com/openfaas/go-sdk (go-request imports go-sdk/builder)
  - {from: function-builder-examples, to: go-sdk, kind: package}
  # function-builder-examples/python-request/requirements.txt: openfaas-sdk @ git+https://github.com/openfaas/python-sdk.git (python-sdk/pyproject.toml name = "openfaas-sdk")
  - {from: function-builder-examples, to: python-sdk, kind: package}
  # go-sdk/go.mod requires github.com/openfaas/faas-provider (imports types, logs)
