  # nats-connector/go.mod requires github.com/openfaas/connector-sdk (imports connector-sdk/types)
  - {from: nats-connector, to: connector-sdk, kind: package}
  # nats-connector/contrib/test-functions/*/go.mod require github.com/openfaas/templates-sdk/go-http
  - {from: nats-connector, to: templates-sdk, kind: package}
  # nats-queue-worker/go.mod requires github.com/openfaas/faas-provider (imports types)
  - {from: nats-queue-worker, to: faas-provider, kind: package}
  # of-watchdog/go.mod requires github.com/openfaas/faas-middleware (imports oauth, concurrency-limiter, auth)
  - {from: of-watchdog, to: faas-middleware, kind: package}
  # of-watchdog/go.mod requires github.com/openfaas/faas-provider (imports httputil)
  - {from: of-watchdog, to: faas-provider, kind: package}
  # openfaas-cloud/go.mod (and buildshiprun, list-functions, ... go.mod) require github.com/openfaas/faas; functions import faas/gateway/requests, metrics
  - {from: openfaas-cloud, to: faas, kind: package, note: "also http: edge-router/functions call the gateway"}
  # openfaas-cloud/go.mod requires github.com/openfaas/faas-cli; functions import faas-cli/stack, proxy, schema
