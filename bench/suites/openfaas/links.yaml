# Which repos really link (cairn bench-links), written from the code, never from cairn's output.
# A link is a pair of repos; `from` uses or depends on `to`.
# Evidence read from each repo's own files (go.mod require blocks, Go imports, Dockerfiles,
# compose/Helm values, CI publish workflows, stack.yml, store JSON). vendor/ was never used as evidence.
# Image -> repo mapping (who BUILDS it): ghcr.io/openfaas/gateway <- faas (.github/workflows/publish.yml),
# queue-worker <- nats-queue-worker (publish.yaml), license-check <- license-check (publish.yaml),
# of-watchdog <- of-watchdog (Makefile), classic-watchdog <- classic-watchdog (publish.yaml),
# cron-/mqtt-/nats-connector, ingress-operator, faas-netes, ofc-* <- their own repos.
split: dev  # held out until 2026-10-10; its first run tuned doc mentions and Go modules
links:
  # ---------------- package (go.mod require / npm / pip / maven) ----------------
  # certifier/go.mod requires github.com/openfaas/faas-cli; certifier/tests import faas-cli/proxy, stack, config
  - {from: certifier, to: faas-cli, kind: package}
  # certifier/go.mod requires github.com/openfaas/faas-provider; tests import faas-provider/types, logs
  - {from: certifier, to: faas-provider, kind: package}
  # classic-watchdog/go.mod requires github.com/openfaas/faas-middleware (imports concurrency-limiter, auth)
  - {from: classic-watchdog, to: faas-middleware, kind: package}
  # connector-sdk/go.mod requires github.com/openfaas/faas-provider (imports types, auth)
  - {from: connector-sdk, to: faas-provider, kind: package}
  # connector-sdk/go.mod requires github.com/openfaas/go-sdk (marked indirect, but types/*.go import go-sdk)
  - {from: connector-sdk, to: go-sdk, kind: package}
  # cron-connector/go.mod requires github.com/openfaas/connector-sdk (imports connector-sdk/types)
  - {from: cron-connector, to: connector-sdk, kind: package}
  # cron-connector/go.mod requires github.com/openfaas/faas-provider (imports types, auth)
  - {from: cron-connector, to: faas-provider, kind: package}
  # cron-connector/go.mod requires github.com/openfaas/go-sdk (main.go: sdk.NewClient)
  - {from: cron-connector, to: go-sdk, kind: package}
  # cron-connector/go.mod requires github.com/openfaas/faas-cli as a direct require (no import found in its own .go files)
  - {from: cron-connector, to: faas-cli, kind: package, note: "direct go.mod require, no direct import seen"}
  # faas/gateway/go.mod requires github.com/openfaas/faas-provider (gateway imports types, auth, httputil)
  - {from: faas, to: faas-provider, kind: package}
  # faas/gateway/go.mod requires github.com/openfaas/nats-queue-worker; gateway imports nats-queue-worker/handler
  - {from: faas, to: nats-queue-worker, kind: package, note: "also pubsub: gateway publishes async requests on NATS subject faas-request (nats-queue-worker/handler/handler.go) that queue-worker consumes (nats-queue-worker/main.go)"}
  # faas-cli/go.mod requires github.com/openfaas/faas-provider (imports types, logs)
