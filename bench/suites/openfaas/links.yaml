  - {from: connector-sdk, to: faas, kind: http}
  # cron-connector/main.go gatewayRoute(): <gateway_url>/function or /async-function; go.mod also has an indirect require of faas/gateway
  - {from: cron-connector, to: faas, kind: http, note: "also indirect go.mod require github.com/openfaas/faas/gateway"}
  # go-sdk client calls the gateway's /system/functions, /function/ routes
  - {from: go-sdk, to: faas, kind: http}
  # ingress-operator/pkg/controller/v1/controller.go: Ingress backend serviceHost "gateway" (port 8080) unless bypassGateway
  - {from: ingress-operator, to: faas, kind: http, note: "creates Ingress records routed to the gateway Service"}
  # mass-deploy/cmd/root.go: --gateway default http://127.0.0.1:8080, deploys/invokes via go-sdk against the gateway
