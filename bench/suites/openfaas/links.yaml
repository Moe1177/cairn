unsure:
  # go.mod `// indirect` only, no import in the repo's own code
  - {between: [cron-connector, nats-queue-worker], note: "only an indirect go.mod require (pulled in via faas/gateway); no direct use"}
  - {between: [nats-connector, faas-provider], note: "only an indirect go.mod require (via connector-sdk); no import"}
  - {between: [golang-http-template, faas-middleware], note: "golang-middleware-inproc go.mod indirect require via of-watchdog; no import"}
  - {between: [golang-http-template, faas-provider], note: "golang-middleware-inproc go.mod indirect require via of-watchdog; no import"}
  - {between: [ofc-bootstrap, faas-cli], note: "indirect go.mod require only, plus ofc-bootstrap shells out to the faas-cli binary"}
  # CLI tool use in scripts/CI only
  - {between: [faasd, faas-cli], note: "faasd hack/install.sh installs faas-cli and Makefile drives faas-cli; tool use, not a code dependency"}
  - {between: [faas-netes, faas-cli], note: "faas-netes CI/contrib scripts use faas-cli; tool use only"}
  # environment/config coupling that may or may not count
  - {between: [faas-middleware, faas], note: "auth/jwt_authenticator.go fetches http://gateway.openfaas:8080/.well-known/openid-configuration; that endpoint belongs to the Pro/IAM gateway, not clearly this repo"}
  - {between: [config-checker, faas], note: "config-checker reads gateway env var names (read_timeout, direct_functions...) that the gateway defines; also .DEREK.yml redirect"}
  - {between: [config-checker, nats-queue-worker], note: "config-checker reads queue-worker env var names (ack_wait, max_inflight) that queue-worker defines"}
  - {between: [faas-cli, golang-http-template], note: "only faas-cli/testing/template-config.yaml names its URL (test material)"}
  # functions built from a template chosen by `lang:` name only (resolved through the store / default templates repo at build time)
  - {between: [cloud-functions, golang-http-template], note: "stack.yml lang golang-middleware, configuration.templates by name only"}
  - {between: [cloud-functions, python-flask-template], note: "stack.yml lang python3-http by name only"}
  - {between: [release-promoter, golang-http-template], note: "stack.yaml lang golang-middleware, configuration.templates by name only"}
  - {between: [store-functions, templates], note: "stack.yml lang node25 by name only (default templates repo)"}
  - {between: [social-functions, templates-classic], note: "stack.yml lang go by name only"}
  - {between: [openfaas-cloud, templates-classic], note: "stack.yml lang go by name only"}
  - {between: [workshop, templates-classic], note: "lab stack.yml files use lang python/python3 by name only"}
  # .DEREK.yml `redirect: https://raw.githubusercontent.com/openfaas/faas/master/.DEREK.yml` (bot config, not code); only pairs with no other link listed
  - {between: [classic-watchdog, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [cloud-functions, faas], note: ".DEREK.yml redirect; stack.yml gateway: http://127.0.0.1:8080 (deploy target)"}
  - {between: [docs, faas], note: ".DEREK.yml redirect and mkdocs repo_url point at faas; docs describe it"}
  - {between: [golang-http-template, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [of-watchdog, faas], note: ".DEREK.yml bot-config redirect; gateway proxies to watchdog port 8080 generically"}
  - {between: [ofc-bootstrap, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [python-flask-template, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [ruby-http, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [social-functions, faas], note: ".DEREK.yml redirect; stack.yml gateway: http://127.0.0.1:8080 (deploy target)"}
  - {between: [store-functions, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [templates-classic, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [templates-sdk, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [templates, faas], note: ".DEREK.yml bot-config redirect to faas only"}
  - {between: [workshop, faas], note: ".DEREK.yml redirect; lab stack.yml gateway: http://127.0.0.1:8080"}
  - {between: [release-promoter, faas], note: "stack.yaml gateway: http://127.0.0.1:8080 (deploy target only)"}
