  # nats-connector/config/config.go: gatewayURL := "http://gateway:8080"
  - {from: nats-connector, to: faas, kind: http}
  # python-sdk/openfaas_sdk/client.py: GET/POST/PUT/DELETE /system/functions, /async-function/{name}
  - {from: python-sdk, to: faas, kind: http}

