  - {from: templates, to: templates-sdk, kind: package, note: "also deploys: of-watchdog/classic-watchdog base images (separate pairs)"}

  # ---------------- http (calls the other's API by hostname/route) ----------------
  # certifier/Makefile + tests: OPENFAAS_URL=http://127.0.0.1:8080/, tests exercise the gateway REST API (README: "certify ... RESTful API")
