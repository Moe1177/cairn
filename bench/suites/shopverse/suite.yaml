name: shopverse
workspace: workspace
related_repos_doc: related_repos.md
tasks:
  - id: owners
    category: orientation
    repo: storefront
    prompt: >-
      Which repository owns the orders database tables, and which other repositories read or
      write the orders table? Answer with repository names only.
    expect_keywords: [orders-svc, admin, payments-svc]
  - id: payments-role
    category: orientation
    repo: admin
    prompt: What does the payments-svc repository do, and which database table does it write?
    expect_keywords: [payments_ledger]
  - id: gift-message
    category: localization
    repo: storefront
    prompt: >-
      We are adding an optional gift_message to orders end to end: database, API model, shared
      TypeScript types, and the storefront checkout. List the existing files that must change, as
      workspace paths like repo/path. Do not edit anything.
    expect_files:
      - orders-svc/migrations/001_orders.sql
      - orders-svc/app/main.py
      - shared-types/src/order.ts
      - storefront/app/checkout/page.tsx
  - id: refund-logic
    category: localization
    repo: admin
    prompt: >-
      Where is the refund logic implemented, and which tables does it write? Give file paths as
      repo/path.
    expect_files: [orders-svc/app/refunds.py]
    expect_keywords: [refunds]
  - id: rename-status
    category: impact
    repo: payments-svc
    prompt: >-
      If the orders.status column is renamed to orders.state, which files across the workspace
      break? List them as repo/path.
    expect_files:
      - orders-svc/migrations/001_orders.sql
      - orders-svc/app/main.py
      - orders-svc/app/refunds.py
      - admin/lib/db.ts
      - payments-svc/internal/ledger.go
      - shared-types/src/order.ts
  - id: cart-total
    category: control
    repo: storefront
    prompt: In this repository, which file computes the cart total? Give its path.
    expect_files: [storefront/lib/cart.ts]
